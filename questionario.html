<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Preferências alimentares · Lise Cozinha</title>
<meta name="theme-color" content="#f06838">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{color-scheme:light;--bg:#fefaf1;--ink:#2b3a2f;--mut:#7b8470;--or:#f06838;--gr:#257444;--line:#e8dec6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:radial-gradient(circle at 100% 0,#fde3d3 0,transparent 32%),radial-gradient(circle at 0 12%,#e3f1e3 0,transparent 30%),var(--bg);color:var(--ink);font:16px/1.4 Nunito,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
main{max-width:600px;margin:auto;padding:18px 16px}
.hd{text-align:center;padding:6px 0 4px}.hd img{width:190px;max-width:60%}
h1{font:600 26px/1.15 Fredoka,Georgia,serif;margin:10px 0 2px;color:var(--or)}.sub{color:var(--mut);margin:0 0 6px}
.card{background:#fffdf7;border:1px solid var(--line);border-radius:20px;padding:16px;margin:14px 0;box-shadow:0 2px 14px rgba(150,100,30,.08)}
.ti{display:flex;align-items:center;gap:10px;margin-bottom:4px}.ic{width:40px;height:40px;border-radius:50%;background:#fde8dc;display:grid;place-content:center;font-size:21px;flex:none}
h2{font:600 19px Fredoka,Georgia,serif;margin:0;color:var(--gr);text-transform:uppercase;letter-spacing:.02em}.q{color:var(--mut);font-size:14.5px;margin:2px 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip,.opt{font:600 15px Nunito,system-ui,sans-serif;border:1.5px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:9px 14px;min-height:42px;cursor:pointer;transition:transform .15s,background .2s,border-color .2s}
.chip:active,.opt:active{transform:scale(.95)}
.chip.on,.opt.on{background:var(--or);border-color:var(--or);color:#fff}.chip.on::before,.opt.on::before{content:"✓ "}
.grp{border:1.5px solid var(--line);border-radius:16px;background:#fff;margin-bottom:8px;overflow:hidden;transition:border-color .2s}
.gh{width:100%;display:flex;align-items:center;gap:10px;background:none;border:0;padding:12px 14px;font:700 16px Nunito,system-ui,sans-serif;color:var(--ink);text-align:left;cursor:pointer;min-height:48px}
.gh i{width:22px;height:22px;border-radius:50%;border:2px solid #cdbf9e;flex:none;display:grid;place-content:center;color:#fff;font-style:normal;font-size:14px;transition:.2s}
.grp.on{border-color:var(--gr)}.grp.on .gh i{background:var(--gr);border-color:var(--gr)}.grp.on .gh i::after{content:"✓"}
.opts{display:none;flex-wrap:wrap;gap:8px;padding:0 12px 12px}.grp.on .opts{display:flex;animation:up .3s both}
.opt{padding:8px 12px;min-height:38px;font-size:14.5px}.opt.on{background:var(--gr);border-color:var(--gr)}
label{display:block;font-size:14px;color:var(--mut);margin:12px 0 4px}
input,textarea{width:100%;font:16px Nunito,system-ui,sans-serif;padding:12px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
textarea{min-height:84px;resize:vertical}input:focus,textarea:focus,button:focus-visible{outline:3px solid var(--gr);outline-offset:2px}
.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(254,250,241,.95);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;justify-content:center}
.bar button{font:700 16px Nunito,system-ui,sans-serif;border:0;border-radius:14px;min-height:50px;padding:0 16px;cursor:pointer}
.send{background:var(--or);color:#fff;flex:1;max-width:340px;box-shadow:0 4px 12px rgba(240,104,56,.35)}.sec{background:#fff;color:var(--gr);border:1.5px solid var(--gr)!important}
details{margin-top:8px}summary{cursor:pointer;color:var(--gr);font-weight:700}pre{white-space:pre-wrap;word-break:break-word;font:14px/1.45 Nunito,system-ui,sans-serif;background:#fff;border:1px dashed var(--line);border-radius:12px;padding:12px}
.ck{display:flex;gap:10px;align-items:flex-start;font-size:14.5px;color:var(--ink);margin:0}.ck input{width:22px;height:22px;flex:none;margin-top:2px;accent-color:var(--gr)}.hp{position:absolute;left:-9999px;opacity:0}.big{display:grid;gap:10px;margin-top:14px}.big button{font:700 16px Nunito,system-ui,sans-serif;border:0;border-radius:14px;min-height:52px;cursor:pointer}.ok{text-align:center;padding:26px 16px}.ok h1{margin-top:6px}
.ft{text-align:center;color:var(--mut);margin:18px 0}.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--gr);color:#fff;padding:10px 16px;border-radius:12px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .3s}.toast.s{opacity:1}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card{animation:up .5s both}.card:nth-of-type(2){animation-delay:.06s}.card:nth-of-type(3){animation-delay:.12s}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

const tx=(t,ph)=>`<input data-t="${t}" placeholder="${ph}" autocomplete="off">`;
$('f').innerHTML=`<div class="card"><div class="ti"><div class="ic">👋</div><h2>Quem é você?</h2></div><label>Seu nome</label>${tx('nome','Nome completo')}<label>Seu WhatsApp</label><input data-t="tel" inputmode="tel" placeholder="(00) 90000-0000"><input class="hp" data-t="site" tabindex="-1" autocomplete="off" aria-hidden="true"></div>`+
SEC.map(s=>`<div class="card"><div class="ti"><div class="ic">${s.ic}</div><h2>${s.t}</h2></div><p class="q">${s.q}</p>`+
 (s.chips?`<div class="chips">${s.chips.map(c=>ci(s.k,c)).join('')}</div>`:'')+
 (s.g?s.g.map(([n,o])=>`<div class="grp" data-k="${s.k}" data-n="${esc(n)}"><button class="gh" data-a="grp"><i></i>${n}</button><div class="opts">${o.map(x=>`<button class="opt" data-a="opt" data-v="${esc(x)}">${x}</button>`).join('')}</div></div>`).join(''):'')+
 (s.other?`<label>${s.other}:</label>${tx(s.k+'O','Escreva aqui')}`:'')+(s.not?`<label>${s.not}</label>${tx(s.k+'N','Escreva aqui')}`:'')+
 (s.k=='tmp'?`<label>Seu plano alimentar (gramas de proteína, carboidrato e legumes por refeição)</label><textarea data-t="plano" placeholder="Ex.: 150 g de proteína, 100 g de arroz, 100 g de legumes"></textarea><label>Observações</label><textarea data-t="obs" placeholder="Algo mais que devemos saber?"></textarea>`:'')+`</div>`).join('')+
`<div class="card"><label class="ck"><input type="checkbox" id="ok"> Autorizo a Lise Cozinha a usar estas informações, inclusive alergias e restrições, para preparar minhas marmitas.</label></div>`;
const tog=(a,v)=>{const i=a.indexOf(v);i<0?a.push(v):a.splice(i,1)};
function secoes(s){const j=a=>a.join(', '),gp=o=>Object.keys(o).map(n=>n+(o[n].length?' ('+j(o[n]).toLowerCase()+')':'')),L=a=>a.length?a:['—'];
 const al=s.alg.concat(s.algO?['Outra: '+s.algO]:[]),tp=s.tmp.concat(s.tmpO?[s.tmpO]:[]);
 return [{ic:'🚫',t:'Alergias ou restrições',items:al.length?al:['Nenhuma informada']},
 {ic:'🍗',t:'Proteínas que gosta',items:L(gp(s.pro)),note:s.proN&&'Não come: '+s.proN},
 {ic:'🍚',t:'Acompanhamentos',items:L(gp(s.car)),note:s.carN&&'Não gosta: '+s.carN},
 {ic:'🥦',t:'Legumes e saladas',items:L(s.leg),note:s.legN&&'Não gosta: '+s.legN},
 {ic:'🌿',t:'Temperos a evitar',items:tp.length?tp:['Nenhum']}]
 .concat(s.plano?[{ic:'📋',t:'Plano alimentar',items:[s.plano]}]:[]).concat(s.obs?[{ic:'💬',t:'Observações',items:[s.obs]}]:[])}
function prefTxt(s){return secoes(s).map(x=>x.t+': '+x.items.join('; ')+(x.note?' ('+x.note+')':'')).join('\n')}
function prefPDF(nome,tel,s,data,logo,ratio){const {jsPDF}=window.jspdf,doc=new jsPDF({unit:'mm',format:'a4'});let y=14;
 doc.addImage(logo,'PNG',75,y,60,60*ratio);y+=60*ratio+9;
 doc.setFont('helvetica','bold').setFontSize(18).setTextColor(240,104,56).text('PREFERÊNCIAS ALIMENTARES',105,y,{align:'center'});y+=7;
 doc.setFont('helvetica','normal').setFontSize(10).setTextColor(90).text('Cliente: '+nome+(tel?'  ·  '+tel:'')+'  ·  '+data,105,y,{align:'center'});y+=5;
 doc.setDrawColor(240,104,56).setLineWidth(.6).line(20,y,190,y);y+=9;
 secoes(s).forEach(x=>{if(y>255){doc.addPage();y=18}
  doc.setFillColor(253,232,220).roundedRect(20,y-5,170,8,2,2,'F');doc.setFont('helvetica','bold').setFontSize(11.5).setTextColor(37,116,68).text(x.t.toUpperCase(),24,y);y+=8;
  doc.setFont('helvetica','normal').setFontSize(10.5).setTextColor(40);
  x.items.forEach(i=>{const ls=doc.splitTextToSize('•  '+i,160);if(y+ls.length*5>282){doc.addPage();y=18}doc.text(ls,26,y);y+=ls.length*5+.6});
  if(x.note){const ls=doc.splitTextToSize(x.note,160);doc.setFont('helvetica','italic').setTextColor(120).text(ls,26,y);y+=ls.length*5}
  y+=5});
 doc.setFont('helvetica','normal').setFontSize(8.5).setTextColor(140).text('Lise Cozinha  ·  comida saudável entregue na sua porta',105,290,{align:'center'});return doc}

function wpp(s){const L=['*🧡 PREFERÊNCIAS ALIMENTARES*','_Lise Cozinha_','','*Cliente:* '+s.nome];if(s.tel)L.push('*WhatsApp:* '+s.tel);
 secoes(s).forEach(x=>{L.push('','*'+x.ic+' '+x.t+'*');x.items.forEach(i=>L.push('• '+i));if(x.note)L.push('_'+x.note+'_')});L.push('','_Enviado pelo formulário da Lise Cozinha_');return L.join('\n')}
function msg(t){const e=$('ts');e.textContent=t;e.classList.add('s');setTimeout(()=>e.classList.remove('s'),2400)}
const logo=()=>document.querySelector('.hd img').src,RATIO=0.4634,hoje=()=>new Date().toLocaleDateString('pt-BR');
function pdf(){if(!st.nome.trim()){msg('Digite seu nome primeiro');document.querySelector('[data-t=nome]').focus();return}prefPDF(st.nome.trim(),st.tel.trim(),st,hoje(),logo(),RATIO).save('preferencias-lise-cozinha.pdf')}
function zap(){window.open('https://wa.me/'+WHATS+'?text='+encodeURIComponent(wpp(st)),'_blank')}
function thanks(ok){$('f').hidden=true;$('bar').hidden=true;document.querySelector('.hd .sub').hidden=true;document.querySelector('.ft').hidden=true;const r=$('res');r.hidden=false;
 r.innerHTML=`<div class="card ok"><div style="font-size:46px">🧡</div><h1>${ok?'Recebemos suas preferências!':'Quase lá!'}</h1><p class="sub">${ok?'A Lise já pode ver tudo. Prepararemos suas marmitas com muito carinho.':'Não conseguimos enviar automaticamente. Envie pelo WhatsApp para a Lise receber.'}</p><div class="big"><button class="${ok?'sec':'send'}" data-a="zap" style="${ok?'background:#fff;color:var(--gr);border:1.5px solid var(--gr)':'background:var(--or);color:#fff'}">📲 ${ok?'Enviar também pelo WhatsApp':'Enviar pelo WhatsApp'}</button><button data-a="pdf" style="background:#fff;color:var(--gr);border:1.5px solid var(--gr)">📄 Salvar uma cópia em PDF</button></div></div>`;scrollTo(0,0)}
async function enviar(){
 if(!st.nome.trim()){msg('Digite seu nome primeiro');document.querySelector('[data-t=nome]').focus();return}
 if(!$('ok').checked){msg('Marque a autorização para enviar');$('ok').scrollIntoView({block:'center'});return}
 if(st.site)return thanks(true);
 const b=$('env');b.disabled=true;b.textContent='Enviando...';
 try{if(!sb)throw 0;const d={...st};delete d.site;const {error}=await sb.from('respostas').insert({nome:st.nome.trim(),tel:st.tel.trim()||null,dados:d,resumo:wpp(st)});if(error)throw error;thanks(true)}
 catch(e){b.disabled=false;b.textContent='📨 Enviar minhas preferências';thanks(false)}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;
 if(a=='chip'){tog(st[b.dataset.k],b.dataset.v);b.classList.toggle('on')}
 else if(a=='grp'){const g=b.closest('.grp'),k=g.dataset.k,n=g.dataset.n;if(st[k][n]){delete st[k][n];g.classList.remove('on');g.querySelectorAll('.opt.on').forEach(x=>x.classList.remove('on'))}else{st[k][n]=[];g.classList.add('on')}}
 else if(a=='opt'){const g=b.closest('.grp'),k=g.dataset.k,n=g.dataset.n;st[k][n]=st[k][n]||[];tog(st[k][n],b.dataset.v);g.classList.add('on');b.classList.toggle('on')}
 else if(a=='pdf')pdf();else if(a=='zap')zap();else if(a=='send')enviar()});
document.addEventListener('input',e=>{const t=e.target.dataset&&e.target.dataset.t;if(t)st[t]=e.target.value});
</script>
</body>
