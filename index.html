 <h2>Novo lançamento</h2><div class="card"><div class="pay"><button class="${lf.t=='in'?'on':''}" onclick="lf.t='in';lf.cat=cats.in[0];render()">＋ Entrada</button><button class="${lf.t=='out'?'on':''}" onclick="lf.t='out';lf.cat=cats.out[0];render()">− Saída</button></div>
 <label>Descrição</label><input value="${lf.desc}" oninput="lf.desc=this.value" placeholder="Ex.: Gás de cozinha"><label>Valor (R$)</label><input inputmode="decimal" value="${lf.v}" oninput="lf.v=this.value" placeholder="0,00">
 <div class="g2"><div><label>Categoria</label><select onchange="lf.cat=this.value">${cats[lf.t].map(c=>`<option ${c==lf.cat?'selected':''}>${c}</option>`).join('')}</select></div><div><label>Forma</label><select onchange="lf.forma=this.value">${['Pix','Dinheiro','Cartão','Vale Sicoob'].map(c=>`<option ${c==lf.forma?'selected':''}>${c}</option>`).join('')}</select></div></div><button onclick="addL()">Lançar</button></div>

 lanc.filter(l=>ff=='todos'||l.t==ff).map(l=>`<div class="card row"><div><b>${l.desc}</b><div class="mut">${l.d} · ${l.cat} · ${l.forma}</div></div><div class="row"><b class="${l.t}">${l.t=='in'?'+':'−'} ${R(l.v)}</b><button class="x" onclick="delL(${l.id})" aria-label="Excluir">×</button></div></div>`).join('');
}
function addL(){const v=P(lf.v);if(!lf.desc.trim()||!(v>0))return alert('Preencha a descrição e o valor.');lanc.unshift({id:seq++,t:lf.t,d:hoje(),desc:lf.desc.trim(),cat:lf.cat,forma:lf.forma,v});lf={t:lf.t,desc:'',v:'',cat:cats[lf.t][0],forma:'Pix'};render()}
function delL(id){lanc.splice(lanc.findIndex(l=>l.id==id),1);render()}
const lin=o=>o.it.map(x=>[x.q+'x '+obj(x).n,R(obj(x).p*x.q)]),ocode=o=>'LC'+pad(o.id);
function cupom(o){const c=cl(o.cl);
 modal.innerHTML=`<div class="modal" onclick="if(event.target==this)modal.innerHTML=''"><div class="sheet"><div class="paper"><div class="in2"><div class="in3"><img src="${LOGO_COL}" alt="Lise Cozinha" style="width:150px;display:block;margin:0 auto 4px"><div style="font-size:10.5px">COMIDA SAUDÁVEL ENTREGUE NA SUA PORTA</div><div style="margin-top:4px">Pedido ${pad(o.id)} · ${hoje()}</div></div>
 <div class="sec">${o.ent=='retirada'?'RETIRADA':'ENTREGA'}</div><div class="in3 t"><b>${c.n}</b><br>${c.tel}<br>${o.ent=='retirada'?'Retirada em Armazém<br>R. Antônio David Filet, 64':c.end+'<br>'+c.b+' - '+c.cid}</div>
 <div class="sec">ITENS</div><div class="in3 t">${lin(o).map(l=>`<div class="l"><span>${l[0]}</span><span>${l[1]}</span></div>`).join('')}<hr>${o.dv?`<div class="l"><span>Desconto ${o.pct}%</span><span>- ${R(o.dv)}</span></div>`:''}<div class="l"><span>Frete</span><span>${R(o.frete)}</span></div></div>
 <div class="bk l" style="margin-top:6px"><span>TOTAL</span><span>${R(tot(o))}</span></div><div style="text-align:center;margin:6px 0">${o.pay} · ${o.paid?'PAGO':'A RECEBER'}</div>

const bc=code=>{const c=document.createElement('canvas');JsBarcode(c,code,{format:'CODE128',height:60,width:3,displayValue:false,margin:0});return c.toDataURL('image/png')};
async function save(doc,name,share){const m=$('msg');try{const blob=doc.output('blob');
 if(share){const f=new File([blob],name,{type:'application/pdf'});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});m.textContent='Enviado.'}else m.textContent='Este navegador não consegue enviar arquivos para outro app. Use o botão Imprimir.';return}
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();m.textContent='PDF baixado.'}catch(e){m.textContent=e.name=='AbortError'?'Cancelado.':'Não foi possível gerar o PDF.'}}
function imprimir(){const p=document.querySelector('.paper');if(!p)return;let a=$('pa');if(!a){a=document.createElement('div');a.id='pa';document.body.appendChild(a)}a.className='paper';a.innerHTML=p.innerHTML;window.print()}
function pdf(id,share){
 const o=orders.find(x=>x.id==id),c=cl(o.cl),{jsPDF}=window.jspdf,ret=o.ent=='retirada',un=cnt(o.it);
 const tmp=new jsPDF({unit:'mm',format:[80,100]});tmp.setFont('helvetica','normal').setFontSize(8.5);
 const L=o.it.map(x=>({q:x.q,n:tmp.splitTextToSize(obj(x).n,46),p:R(obj(x).p*x.q)}));
 const addr=ret?['Retirada em Armazém','R. Antônio David Filet, 64 - Centro']:tmp.splitTextToSize(c.end,64).concat(tmp.splitTextToSize(c.b+' - '+c.cid,64));
 const draw=(doc,H)=>{let y=0;
  doc.setDrawColor(0).setTextColor(0).setLineWidth(.7).rect(2,2,76,H-4);doc.setLineWidth(.25).rect(3.2,3.2,73.6,H-6.4);
  const lw=48,lh=lw*LOGO_R;doc.addImage(LOGO_COL,'PNG',16,8,lw,lh);y=8+lh+4;
  doc.setFont('helvetica','bold').setFontSize(6.3).text('COMIDA SAUDÁVEL ENTREGUE NA SUA PORTA',40,y,{align:'center'});y+=3.2;
  const wave=yy=>{doc.setLineWidth(.35);let up=true;for(let x=13;x<66;x+=1.7){doc.line(x,yy+(up?-.6:.6),x+1.7,yy+(up?.6:-.6));up=!up}};wave(y);y+=5;
  doc.setFillColor(0).roundedRect(7,y,66,6.6,1.3,1.3,'F');doc.setTextColor(255).setFontSize(9).text('PEDIDO '+pad(o.id),10,y+4.6);doc.setFont('helvetica','normal').text(hoje(),70,y+4.6,{align:'right'});doc.setTextColor(0);y+=11.5;
  const sec=t=>{doc.setFont('helvetica','bold').setFontSize(7.5);doc.setFillColor(0).rect(7,y,doc.getTextWidth(t)+6,4.3,'F');doc.setTextColor(255).text(t,10,y+3.1);doc.setTextColor(0);y+=7.4;doc.setFont('helvetica','normal').setFontSize(8.5)};
  sec(ret?'RETIRADA':'ENTREGA');doc.setFont('helvetica','bold').text(c.n,7,y);y+=4.3;doc.setFont('helvetica','normal');doc.text(c.tel,7,y);y+=4.3;addr.forEach(a=>{doc.text(a,7,y);y+=4.2});y+=3;
  sec('ITENS ('+un+')');
  L.forEach(l=>{doc.setFont('helvetica','bold').text(l.q+'x',7,y);doc.setFont('helvetica','normal').text(l.n,13,y,{lineHeightFactor:1.15});doc.text(l.p,73,y,{align:'right'});y+=l.n.length*3.7+1.6});
  doc.setLineDashPattern([1,1],0).setLineWidth(.25).line(7,y-1,73,y-1);doc.setLineDashPattern([],0);y+=3.6;
  const row=(a,b)=>{doc.text(a,7,y);doc.text(b,73,y,{align:'right'});y+=4.6};
  row('Subtotal',R(subt(o.it)));if(o.dv)row('Desconto '+o.pct+'%','- '+R(o.dv));row(ret?'Retirada':'Frete',o.frete?R(o.frete):(ret?'sem taxa':'grátis'));y+=1.5;
  doc.setFillColor(0).roundedRect(7,y,66,9,1.5,1.5,'F');doc.setTextColor(255).setFont('helvetica','bold').setFontSize(13).text('TOTAL',10,y+6.3);doc.text(R(tot(o)),70,y+6.3,{align:'right'});doc.setTextColor(0);y+=13.5;
  doc.setLineWidth(.4).roundedRect(7,y,66,7,1.5,1.5);doc.setFontSize(8.5).text(o.pay+'  ·  '+(o.paid?'PAGO':'A RECEBER'),40,y+4.7,{align:'center'});y+=11.5;
  doc.addImage(bc(ocode(o)),'PNG',15,y,50,11);y+=14;doc.setFont('courier','normal').setFontSize(8).text(ocode(o),40,y,{align:'center'});y+=5;
  wave(y);y+=5;doc.setFont('helvetica','bold').setFontSize(8.5).text('Obrigada pela preferência!',40,y,{align:'center'});y+=6;return y};
 const end=draw(new jsPDF({unit:'mm',format:[80,500]}),500),doc=new jsPDF({unit:'mm',format:[80,end+4]});draw(doc,end+4);
 save(doc,'cupom-lise-'+pad(o.id)+'.pdf',share);
}

function secoes(s){const j=a=>a.join(', '),gp=o=>Object.keys(o).map(n=>n+(o[n].length?' ('+j(o[n]).toLowerCase()+')':'')),L=a=>a.length?a:['—'];
 const al=s.alg.concat(s.algO?['Outra: '+s.algO]:[]),tp=s.tmp.concat(s.tmpO?[s.tmpO]:[]);
 return [{ic:'🚫',t:'Alergias ou restrições',items:al.length?al:['Nenhuma informada']},
 {ic:'🍗',t:'Proteínas que gosta',items:L(gp(s.pro)),note:s.proN&&'Não come: '+s.proN},
 {ic:'🍚',t:'Acompanhamentos',items:L(gp(s.car)),note:s.carN&&'Não gosta: '+s.carN},
 {ic:'🥦',t:'Legumes e saladas',items:L(s.leg),note:s.legN&&'Não gosta: '+s.legN},
 {ic:'🌿',t:'Temperos a evitar',items:tp.length?tp:['Nenhum']}]
 .concat(s.plano?[{ic:'📋',t:'Plano alimentar',items:[s.plano]}]:[]).concat(s.obs?[{ic:'💬',t:'Observações',items:[s.obs]}]:[])}
function prefTxt(s){return secoes(s).map(x=>x.t+': '+x.items.join('; ')+(x.note?' ('+x.note+')':'')).join('\n')}
function prefPDF(nome,tel,s,data,logo,ratio){const {jsPDF}=window.jspdf,doc=new jsPDF({unit:'mm',format:'a4'}),OR=[240,104,56],GR=[37,116,68];let y=0;
 const head=()=>{doc.setFillColor(254,250,241).rect(0,0,210,46,'F');doc.addImage(logo,'PNG',75,7,60,60*ratio);doc.setFillColor(...OR).rect(0,46,210,2.2,'F')};
 head();doc.setFont('helvetica','bold').setFontSize(17).setTextColor(...OR).text('PREFERÊNCIAS ALIMENTARES',105,60,{align:'center'});
 doc.setFont('helvetica','normal').setFontSize(10).setTextColor(100).text('Cliente: '+nome+(tel?'  ·  '+tel:'')+'  ·  '+data,105,66.5,{align:'center'});y=78;
 let x=22;const pl=(t,solid)=>{doc.setFontSize(9.5).setFont('helvetica',solid?'bold':'normal');const w=doc.getTextWidth(t)+7;if(x+w>188){x=22;y+=8.6}
  if(solid){doc.setFillColor(...GR).roundedRect(x,y-4.6,w,6.6,3.3,3.3,'F');doc.setTextColor(255)}else{doc.setFillColor(253,240,232).setDrawColor(...OR).setLineWidth(.3).roundedRect(x,y-4.6,w,6.6,3.3,3.3,'FD');doc.setTextColor(150,60,20)}
  doc.text(t,x+3.5,y);x+=w+2.4};
 secoes(s).forEach(c=>{if(y>252){doc.addPage();y=20}
  doc.setFillColor(...OR).roundedRect(20,y-4.4,2.6,6,1,1,'F');doc.setFont('helvetica','bold').setFontSize(11.5).setTextColor(...GR).text(c.t.toUpperCase(),25,y);y+=3.2;doc.setDrawColor(232,222,198).setLineWidth(.3).line(20,y,190,y);y+=7.6;x=22;
  if(c.t=='Plano alimentar'||c.t=='Observações'){doc.setFont('helvetica','normal').setFontSize(10.5).setTextColor(50);const ls=doc.splitTextToSize(c.items[0],164);doc.text(ls,22,y-1);y+=ls.length*5}
  else c.items.forEach(i=>{const m=i.match(/^(.*) \(([^()]*)\)$/);if(m){pl(m[1],1);m[2].split(', ').forEach(p=>pl(p,0))}else pl(i,0)});
  if(c.note){y+=8;doc.setFont('helvetica','italic').setFontSize(10).setTextColor(130,50,30).text(c.note,22,y)}
  y+=13});
 const n=doc.getNumberOfPages();for(let i=1;i<=n;i++){doc.setPage(i);doc.setFont('helvetica','normal').setFontSize(8.5).setTextColor(140).text('Lise Cozinha  ·  comida saudável entregue na sua porta',105,291,{align:'center'})}
 return doc}

const SEED=JSON.parse(JSON.stringify(prods)),FR0={...fr};
let last={},ready=false,tmr=null;

const snap=()=>({clients,prods,cbs,ins,orders,lanc,props,fr,meta:{seq,sv:2}});
