async function cam(){const m=$('cmsg');
 if(!('BarcodeDetector' in window)){m.textContent='Este navegador não lê código pela câmera. Use o campo abaixo, toque nas marmitas ou use um leitor de código de barras.';return}
 try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});const v=$('vid');v.srcObject=stream;v.hidden=false;await v.play();const det=new BarcodeDetector({formats:['code_128']});scanOn=true;
  const loop=async()=>{if(!scanOn)return;try{(await det.detect(v)).forEach(b=>chk(b.rawValue))}catch(e){}setTimeout(loop,400)};loop();m.textContent='Aponte para o código da etiqueta.'}

const SUPABASE_URL=(window.SUPABASE_URL||'').trim(),SUPABASE_KEY=(window.SUPABASE_KEY||'').trim();
let sb=null;try{sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY)}catch(e){}
const me=Math.random().toString(36).slice(2);
const SEED=JSON.parse(JSON.stringify(prods)),FR0={...fr};
let last={},ready=false,tmr=null;
const stat=t=>{const e=$('st');if(e)e.textContent=t};
const snap=()=>({clients,prods,cbs,ins,orders,lanc,fr,meta:{seq,sv:2}});
function apply(m){[['clients',clients],['prods',prods],['cbs',cbs],['ins',ins],['orders',orders],['lanc',lanc]].forEach(([k,a])=>{if(m[k])a.splice(0,a.length,...m[k])});if(m.fr)Object.assign(fr,m.fr);if(m.meta)seq=Math.max(seq,m.meta.seq||0)}
function persist(){if(!ready)return;stat('Salvando...');clearTimeout(tmr);tmr=setTimeout(async()=>{const s=snap();
 for(const k in s){const j=JSON.stringify(s[k]);if(last[k]===j)continue;const {error}=await sb.from('kv').upsert({key:k,value:s[k],by:me,updated_at:new Date().toISOString()});if(error){stat('Sem conexão');return}last[k]=j}stat('Salvo ✓')},500)}
const _render=render;render=function(){_render();persist()};
function busy(){const a=document.activeElement;return modal.innerHTML!==''||(a&&/INPUT|SELECT|TEXTAREA/.test(a.tagName))}
async function load(){const {data,error}=await sb.from('kv').select('key,value');if(error)throw error;const m={};data.forEach(r=>{m[r.key]=r.value;last[r.key]=JSON.stringify(r.value)});apply(m);if(!(m.meta&&m.meta.sv>=2)){if(!m.prods||m.prods.every(p=>!p.p&&!p.c))prods.splice(0,prods.length,...SEED);Object.assign(fr,FR0)}}
function live(){sb.channel('kv').on('postgres_changes',{event:'*',schema:'public',table:'kv'},p=>{const r=p.new;if(!r||!r.key||r.by===me)return;last[r.key]=JSON.stringify(r.value);apply({[r.key]:r.value});if(!busy())render()}).subscribe()}
function sair(){sb.auth.signOut().then(()=>location.reload())}
function loginUI(msg=''){nav.innerHTML='';$('sb').textContent='Entrar';app.innerHTML=`<div class="card" style="margin-top:30px"><img src="logo.png" alt="Lise Cozinha" style="height:72px;display:block;margin:0 auto 10px"><h2 style="margin-top:0;text-align:center">Bem-vinda</h2><label>E-mail</label><input id="em" type="email" autocomplete="username"><label>Senha</label><input id="pw" type="password" autocomplete="current-password" onkeydown="if(event.key=='Enter')entrar()"><div class="mut" id="lm" style="color:var(--r);margin-bottom:8px">${msg}</div><button onclick="entrar()">Entrar</button></div>`}
async function entrar(){const {error}=await sb.auth.signInWithPassword({email:$('em').value.trim(),password:$('pw').value});if(error)return loginUI('E-mail ou senha incorretos.');boot()}
async function boot(){
 if(!window.supabase){showErr('A biblioteca do banco de dados não carregou. Verifique a internet ou se algum bloqueador de anúncios está ativo.');return}
 if(!SUPABASE_URL||!SUPABASE_KEY||!sb||!/^https:\/\/.+\.supabase\.co\/?$/.test(SUPABASE_URL)){app.innerHTML='<div class="card alert" style="margin-top:20px"><b>Falta configurar</b><div class="mut">Abra o arquivo config.js e cole a URL (começa com https:// e termina em .supabase.co) e a chave (começa com sb_publishable_), cada uma entre aspas.</div></div>';return}
 const {data:{session}}=await sb.auth.getSession();if(!session)return loginUI();
 try{await load();ready=true;live();go('home');persist()}catch(e){app.innerHTML='<div class="card alert"><b>Não consegui conectar ao banco</b><div class="mut">Confira a internet, a URL e a chave do Supabase, e se o arquivo schema.sql foi executado.</div></div>'}}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
boot();
</script>
